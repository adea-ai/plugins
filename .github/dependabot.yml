version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    ignore:
      # Code Foundry runtime pins are sync-managed (runtime_ref in
      # code-foundry.yml). Dependabot must never bump them; a stale
      # github-actions group PR branched before a sync can resurrect
      # legacy caller files when merged.
      - dependency-name: '0xPlayerOne/code-foundry*'
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
  # Bun, not npm: this repository is managed by Bun (`bun.lock`, no
  # package-lock.json), and Dependabot's npm_and_yarn ecosystem cannot update a
  # bun.lock - every run ended in `misconfigured_tooling` with no dependency pull
  # request produced. The `bun` ecosystem is the one that reads and updates
  # bun.lock, so the entry stays as `bun` even though it cannot succeed yet:
  # measured 2026-09-25, Dependabot's bundled Bun supports `bun.lock`
  # lockfileVersion up to 1 while `bun.lock` here is 2, and it reports
  # `Unsupported bun.lock 'lockfileVersion' 2`. Version and security updates for
  # the root therefore stay blocked until Dependabot's Bun catches up; the
  # validation lane's dependency audit still reports vulnerable dependencies, and
  # remediation is a manual `bun update` until then.
  - package-ecosystem: bun
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 99
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns: ['*']
    ignore:
      # TypeScript 7 (the native compiler) is supported by the oxlint/oxfmt
      # toolchain; the tsconfig must use NodeNext or bundler resolution since
      # legacy node10 resolution was removed. Held with 5.9 until each
      # repository's tsconfig is verified on 7.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
      # Held with TypeScript 5.9 above.
      - dependency-name: '@types/node'
        versions: ['>=23']
