name: Publish marketplace toolkit

# Publishes the marketplace toolkit packages (@adea-ai/catalog-schema with
# the JSON Schema artifacts, @adea-ai/source-adapters, @adea-ai/harness-adapters,
# @adea-ai/catalog-core) to the public npm registry on every main push that
# touches them (plus manual dispatch). Already-published versions are
# skipped, so the workflow is safe to re-run.
#
# Prerequisites (one-time, dashboard):
#   Set NPM_TOKEN to an automation token with publish rights on @adea-ai/*.

on:
  push:
    branches: [main]
    paths:
      - 'packages/catalog-schema/**'
      - 'packages/source-adapters/**'
      - 'packages/harness-adapters/**'
      - 'packages/catalog-core/**'
      - 'schemas/**'
      - 'scripts/publish-packages.mjs'
      - '.github/workflows/publish-packages.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: plugins-publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish-packages.mjs
