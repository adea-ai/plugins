name: Publish marketplace toolkit

# Publishes the marketplace toolkit to the public npm registry as the single
# package @adea-ai/plugins when main changes it. Already-published versions are
# skipped, so rerunning does not publish the same version twice.
#
# One-time npm setup: configure a trusted publisher for @adea-ai/plugins with
# GitHub repository adea-ai/plugins, workflow publish-packages.yml, and npm
# publish permission. Publishing uses OIDC and needs no long-lived npm token.

on:
  push:
    branches: [main]
    paths:
      - 'packages/plugins/**'
      - 'schemas/**'
      - 'scripts/publish-packages.mjs'
      - '.github/workflows/publish-packages.yml'
permissions:
  contents: read
  id-token: write

concurrency:
  group: plugins-publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@12.1.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish changed packages
        run: bun scripts/publish-packages.mjs
