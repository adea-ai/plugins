name: Staged reader Windows qualification

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, synchronize]
    paths:
      - 'packages/plugins/src/staged-file.ts'
      - 'packages/cli/src/**'
      - 'packages/plugins/test-support/**'
      - 'scripts/verify-published-artifacts.ts'
      - 'scripts/verify-catalog-branch.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/staged-reader-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staged-reader-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualification:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Exercise the CLI and publication boundaries under Bun
        run: bun test packages/cli/src/agent-plugins.test.ts packages/cli/src/publication-scripts.test.ts --timeout 30000
      - name: Exercise staged reads under Node
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { mkdtemp, rm, symlink, writeFile } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { readStagedFile } from './packages/plugins/src/staged-file.ts'
          const dir = await mkdtemp(join(tmpdir(), 'staged-reader-'))
          try {
            await writeFile(join(dir, 'regular'), 'expected')
            assert.equal((await readStagedFile(dir, 'regular')).toString(), 'expected')
            await symlink(join(dir, 'regular'), join(dir, 'link'))
            await assert.rejects(readStagedFile(dir, 'link'), /STAGED_FILE_UNSAFE/)
          } finally {
            await rm(dir, { recursive: true, force: true })
          }
          NODE
