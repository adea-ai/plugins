name: Marketplace CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketplace-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type-check
      - name: Unit and integration tests
        run: bun test --timeout 30000
      - name: Build
        run: bun run build
      - name: Schema and integrity validation
        run: bun run schema:check && bun run verify:integrity
      - name: Generated artifact consistency
        run: |
          set -euo pipefail
          live_backup="$(mktemp -d)"
          cp -r generated/. "$live_backup/"
          restore_live() { rm -rf generated && mv "$live_backup" generated; }
          trap restore_live EXIT
          # Offline fixture regen must byte-match the committed fixture snapshots.
          # Live snapshots in generated/ belong to the publish flow, not this check.
          bun run catalog sync --offline --fixture-root fixtures --json > /dev/null
          diff -r generated fixtures/expected
          restore_live
          trap - EXIT
      - name: Dependency and secret scan boundary
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!bun.lock'; then
            echo 'Potential secret detected.'
            exit 1
          else
            test $? -eq 1
          fi
