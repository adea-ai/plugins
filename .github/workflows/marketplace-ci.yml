name: Marketplace CI

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: marketplace-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - name: Restore Bun package downloads
        id: bun-downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-1.4.3-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-downloads-v1-${{ runner.os }}-${{ runner.arch }}-1.4.3-
      # The packed-consumer qualification runs the COMPILED package under
      # Node 24: the package's `bun` export condition selects src/*.ts, so the
      # compiled artifact is only reached by a runtime that honours the
      # `import` condition. This is the repository's established pinned setup —
      # the same action and version publish-packages.yml uses.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Save Bun package downloads
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.bun-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-downloads.outputs.cache-primary-key }}
      - name: Formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type-check
      - name: Unit and integration tests
        run: bun test --timeout 30000
      - name: Build
        run: bun run build
      - name: Schema and integrity validation
        run: bun run schema:check && bun run verify:integrity
      - name: Generated artifact consistency
        run: |
          set -euo pipefail
          live_backup="$(mktemp -d)"
          cp -r generated/. "$live_backup/"
          restore_live() { rm -rf generated && mv "$live_backup" generated; }
          trap restore_live EXIT
          # Offline fixture regen must byte-match the committed fixture snapshots.
          # Live snapshots in generated/ belong to the publish flow, not this check.
          bun run catalog sync --offline --fixture-root fixtures --legacy-catalog --json > /dev/null
          diff -r generated fixtures/expected
          restore_live
          trap - EXIT
      - name: Canonical package determinism
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          bun run catalog sync --offline --fixture-root fixtures --output "$temporary/first" --json > /dev/null
          bun run catalog sync --offline --fixture-root fixtures --output "$temporary/second" --json > /dev/null
          bun run catalog validate --output "$temporary/first" --require-portable --json
          diff -r "$temporary/first" "$temporary/second"
      - name: Dependency and secret scan boundary
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' -- . ':!bun.lock'; then
            echo 'Potential secret detected.'
            exit 1
          else
            test $? -eq 1
          fi
