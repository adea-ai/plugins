name: Marketplace Synchronization

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap-only:
        description: Publish the checked-in last-known-good catalog without live upstream retrieval.
        required: false
        type: boolean
        default: false

# Repository writes are granted only to the synchronization job below.
permissions: {}

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize marketplace catalog
    # Publishing releases and updating the bot-owned snapshot branch require
    # these write scopes; all other workflow jobs are denied by default.
    permissions:
      contents: write # Publish immutable releases and the snapshot branch.
      pull-requests: write # Open and merge the validated snapshot PR.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare bootstrap report
        if: inputs['bootstrap-only'] == true
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('generated/catalog.v1.json','utf8')); const report={ok:true,changed:false,dryRun:false,sourceHeads:c.sources.map(s=>({sourceId:s.sourceId,commitSha:s.resolvedCommitSha})),changeReport:{schemaVersion:1,changedSources:[],addedPlugins:[],removedPlugins:[],changedPlugins:[],skippedPlugins:[],permissionSensitiveChanges:[],contentResolution:'complete'},catalogId:c.catalogId,pluginCount:c.plugins.length,sourceCount:c.sources.length}; fs.writeFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json', JSON.stringify(report));"
      - name: Resolve and build catalog
        id: sync
        if: inputs['bootstrap-only'] != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bun packages/cli/src/index.ts sync --json | tee "$RUNNER_TEMP/catalog-change-report.json"
      - name: Validate catalog
        run: bun run catalog validate --json
      - name: Verify brand marks
        if: inputs['bootstrap-only'] != true
        run: |
          set -o pipefail
          # Marks are staged by the build from the exact bytes each digest was
          # taken over, so this is a local integrity check with no re-fetch.
          # `catalog mirror-icons` remains the backfill path when a snapshot is
          # published from a checkout that has no staged assets.
          bun packages/cli/src/index.ts verify-assets --json \
            | tee "$RUNNER_TEMP/catalog-icon-report.json"
      - name: Determine publication
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reads one reviewable field out of the audit written below; list
          # fields print one entry per line so shell loops can consume them.
          audit_field() {
            node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE,'utf8')); const v=a[process.argv[1]]; process.stdout.write(Array.isArray(v)?v.join('\n'):v===undefined||v===null?'':String(v))" "$1"
          }
          export AUDIT_FILE="$RUNNER_TEMP/catalog-release-audit.json"
          catalog_id=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('generated/catalog.v1.json','utf8')); process.stdout.write(c.catalogId)")
          tag="catalog/${catalog_id#catalog:}"
          changed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json','utf8')); process.stdout.write(String(r.changed === true))")
          release_state="$RUNNER_TEMP/catalog-release-state.json"
          release_exists=true
          if ! gh release view "$tag" --json assets,isDraft,isImmutable > "$release_state" 2>/dev/null; then
            release_exists=false
            printf '{}' > "$release_state"
          fi
          release_is_immutable=false
          release_is_draft=false
          if [ "$release_exists" = true ]; then
            release_is_immutable=$(gh release view "$tag" --json isImmutable --jq '.isImmutable')
            release_is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
          fi
          # "Already uploaded" is not evidence of correctness, so a release is
          # never trusted because an asset of that name is attached: every
          # declared artifact and mirrored mark is compared against the bytes
          # this build staged. An asset left by another build under the same tag
          # therefore surfaces here, while a draft can still be repaired and
          # before a published release is promoted. integrity.json enumerates
          # the required set, so it follows the catalog itself.
          bun run audit:release -- \
            --artifacts generated \
            --assets catalog-assets \
            --catalog-id "$catalog_id" \
            --release-tag "$tag" \
            --release-state "$release_state" \
            | tee "$AUDIT_FILE"
          audit=$(audit_field agrees)
          bootstrap=false
          if [ "$audit" != true ]; then
            bootstrap=true
          fi
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          is_latest=false
          if [ "$latest_tag" = "$tag" ]; then
            is_latest=true
          fi
          publish=false
          if [ "$changed" = true ] || [ "$bootstrap" = true ] || [ "$is_latest" != true ] || [ "$release_is_immutable" != true ]; then
            publish=true
          fi
          {
            echo "catalog_id=$catalog_id"
            echo "release_tag=$tag"
            echo "release_exists=$release_exists"
            echo "release_is_draft=$release_is_draft"
            echo "release_is_immutable=$release_is_immutable"
            echo "assets_agree=$audit"
            echo "bootstrap=$bootstrap"
            echo "audit_file=$AUDIT_FILE"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Publish immutable catalog release
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
        run: |
          set -euo pipefail
          # Reads one reviewable field out of the audit written above; list
          # fields print one entry per line so shell loops can consume them.
          audit_field() {
            node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE,'utf8')); const v=a[process.argv[1]]; process.stdout.write(Array.isArray(v)?v.join('\n'):v===undefined||v===null?'':String(v))" "$1"
          }
          export AUDIT_FILE="$RUNNER_TEMP/catalog-release-audit.json"
          tag="$RELEASE_TAG"
          latest_asset="$RUNNER_TEMP/catalog-latest.v1.json"
          cp generated/catalog.v1.json "$latest_asset"
          # Refuse before anything is created, edited or promoted: a published
          # release cannot be repaired in place, and a checkout that cannot
          # supply the declared bytes cannot build a release from them either.
          blocked=$(audit_field blocked)
          if [ -n "$blocked" ]; then
            echo "$blocked" >&2
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              $(node -e "const fs=require('fs'); const i=JSON.parse(fs.readFileSync('generated/integrity.json','utf8')); process.stdout.write([...Object.keys(i.files),'integrity.json'].map(n=>'generated/'+n).join(' '))") \
              $(node -e "const fs=require('fs'); const i=JSON.parse(fs.readFileSync('generated/integrity.json','utf8')); process.stdout.write((i.assets??[]).map(a=>'catalog-assets/'+a.name).join(' '))") \
              "$latest_asset" \
              --target "$(git rev-parse HEAD)" \
              --draft \
              --title "Marketplace catalog $tag" \
              --notes-file "$RUNNER_TEMP/catalog-change-report.json"
          else
            release_is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            release_is_immutable=$(gh release view "$tag" --json isImmutable --jq '.isImmutable')
            if [ "$release_is_draft" != true ] && [ "$release_is_immutable" != true ]; then
              echo "Published release $tag is not immutable; refusing to mutate it. Remove the invalid release and rerun bootstrap." >&2
              exit 1
            fi
            # A draft is editable, so every asset the audit found missing,
            # carrying other bytes, or unverifiable is re-uploaded from this
            # build, and assets this build does not declare are dropped.
            while IFS= read -r asset; do
              test -n "$asset" || continue
              gh release delete-asset "$tag" "$asset" --yes
            done <<< "$(audit_field remove)"
            while IFS= read -r asset; do
              test -n "$asset" || continue
              path="generated/$asset"
              if [ ! -f "$path" ]; then path="catalog-assets/$asset"; fi
              if [ ! -f "$path" ]; then
                if [ "$asset" = "catalog-latest.v1.json" ]; then
                  path="$latest_asset"
                else
                  echo "no staged bytes for declared asset $asset; refusing to publish a release the catalog cannot fill" >&2
                  exit 1
                fi
              fi
              echo "uploading $asset from $path"
              gh release upload "$tag" "$path" --clobber
            done <<< "$(audit_field upload)"
          fi
          # Publishing a draft is the only edit this step may make: a release
          # that is already published is immutable, and GitHub rejects any edit
          # of it. Re-running a build that produced an identical catalog (the
          # same source pins yield the same tag) therefore finds the release
          # already published and latest, and needs no edit at all.
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)" = "true" ]; then
            gh release edit "$tag" --draft=false --latest
          else
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "$tag" \
              || { echo "existing release $tag is not latest; refusing to rewrite an immutable release" >&2; exit 1; }
            echo "release $tag is already published and latest; no edit needed."
          fi
      - name: Verify published catalog assets
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.publication.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/catalog-release"
          mkdir -p "$release_dir"
          tag="$RELEASE_TAG"
          actual_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          expected_assets=$(node -e "const fs=require('fs'); const i=JSON.parse(fs.readFileSync('generated/integrity.json','utf8')); const names=[...Object.keys(i.files),(i.assets??[]).map(a=>a.name),'integrity.json','catalog-latest.v1.json'].flat().sort(); process.stdout.write(names.join('\n')+'\n')")
          test "$actual_assets" = "$expected_assets"
          # A release with hundreds of assets is downloaded one request at a
          # time, and a single transient API error would otherwise fail the gate
          # and skip the snapshot refresh. Retry the whole download instead.
          for attempt in 1 2 3; do
            if gh release download "$tag" --dir "$release_dir" --clobber; then
              break
            fi
            echo "release download attempt ${attempt} failed" >&2
            test "$attempt" -lt 3 || exit 1
            sleep 10
          done
          bun run verify:published -- "$release_dir" "$release_dir"
          cmp "$release_dir/catalog.v1.json" "$release_dir/catalog-latest.v1.json"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "$tag"
          test "$(gh release view "$tag" --json isImmutable --jq '.isImmutable')" = true
      - name: Publish browser assets
        if: inputs['bootstrap-only'] != true
        env:
          SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # A browser cannot read a release asset, so the marks and the index are
          # pushed to a branch of their own and served from raw.githubusercontent,
          # where they are CORS-enabled and cacheable. Pushing here, not through
          # the snapshot pull request, keeps the URLs valid the moment a release
          # advertises them instead of waiting on a merge.
          #
          # This runs after the publication gate on purpose: the branch is what a
          # browser is told to fetch, so it must not advertise an artifact set
          # whose release has not been verified. The bytes pushed are the same
          # staged ones the gate just downloaded and re-hashed.
          test -d catalog-assets || { echo 'no staged assets to publish' >&2; exit 0; }
          worktree="$(mktemp -d)"
          git worktree add --detach "$worktree" >/dev/null
          find "$worktree" -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R catalog-assets/. "$worktree/"
          cd "$worktree"
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(catalog): publish browser assets" >/dev/null
          git push --force \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/catalog-assets
      - name: Open catalog snapshot pull request
        id: commit
        env:
          SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          branch='chore/catalog-snapshot'
          changed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json','utf8')); process.stdout.write(String(r.changed === true))")
          if [ -z "$SYNC_TOKEN" ]; then
            echo 'CATALOG_SYNC_TOKEN is not configured. Create a fine-grained PAT'
            echo '(Contents: read/write, Pull requests: read/write on adea-ai/plugins)'
            echo 'and store it as the CATALOG_SYNC_TOKEN repository secret.' >&2
            if [ "$changed" = "true" ]; then exit 1; fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NOTE: push, PR creation and the ready transition MUST use
          # CATALOG_SYNC_TOKEN (a PAT), not GITHUB_TOKEN: events triggered by
          # GITHUB_TOKEN do not start new workflow runs, so a GITHUB_TOKEN-authored
          # pull request would never get its required checks, and a
          # GITHUB_TOKEN-driven ready transition would never start Marketplace CI.
          export GH_TOKEN="$SYNC_TOKEN"
          # Main requires an up-to-date head before a pull request can merge, and
          # this job commits the snapshot on top of the main it checked out at the
          # start of a ~20 minute run. Anything that lands meanwhile -- a Release
          # Please merge, another pull request -- leaves the branch BEHIND with
          # every check green and auto-merge armed, so nothing reports an error
          # and the snapshot simply never lands. Merging main in is the fix, and
          # it moves the head, which invalidates the required `checks` context
          # that only a ready_for_review transition produces.
          converge() {
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/pulls/$1/update-branch" >/dev/null 2>&1
          }
          # Marketplace CI runs only on the ready_for_review transition, so a pull
          # request created as ready -- or a fresh head on one that is already
          # ready -- never reports the required `checks` context and the
          # auto-merge waits forever. A draft->ready cycle fires exactly one
          # transition for the current head. Auto-merge then lands it once the
          # checks pass; a red snapshot stays open for inspection instead.
          arm() {
            if [ "$(gh pr view "$1" --json isDraft --jq '.isDraft')" != "true" ]; then
              gh pr ready --undo "$1"
            fi
            gh pr ready "$1"
            gh pr merge "$1" --squash --auto
          }
          existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ "$changed" != "true" ]; then
            echo 'No source changed; generated catalog remains untouched.'
            # An untouched catalog still leaves a stalled snapshot behind, so a
            # pull request that main has moved past is brought up to date and
            # re-armed rather than waiting for the next real refresh.
            if [ -n "$existing" ] && converge "$existing"; then
              echo "merged main into pull request #${existing}."
              arm "$existing"
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branch protection on main forbids direct pushes (code-foundry
          # direct workflow: every change lands via PR + required checks).
          # Publish the snapshot on a bot-owned branch and open or update a
          # pull request instead. Review Policy auto-passes bot authors and
          # Validation + Marketplace CI gate the merge, so nothing blocks.
          catalog_id=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('generated/catalog.v1.json','utf8')); process.stdout.write(c.catalogId)")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add generated catalog-assets
          git commit -m "chore(catalog): refresh marketplace snapshot ${catalog_id}"
          git push --force origin "HEAD:${branch}"
          body="Automated marketplace snapshot refresh for ${catalog_id}. Merge with squash once Validation, Review Policy, and Marketplace CI pass."
          if [ -z "$existing" ]; then
            gh pr create --draft --base main --head "$branch" --title "chore(catalog): refresh marketplace snapshot" --body "$body"
            existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          else
            echo "Updated existing pull request #${existing}."
          fi
          if converge "$existing"; then
            echo "merged main into pull request #${existing}."
          fi
          arm "$existing"
          echo "changed=true" >> "$GITHUB_OUTPUT"
