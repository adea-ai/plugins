name: Marketplace Synchronization

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      bootstrap-only:
        description: Publish the checked-in last-known-good catalog without live upstream retrieval.
        required: false
        type: boolean
        default: false
      force-rebuild:
        description: Rebuild and republish even when every source pin is unchanged, so a curation or build-logic change can land.
        required: false
        type: boolean
        default: false

# Repository writes are granted only to the synchronization job below.
permissions: {}

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize marketplace catalog
    # Publishing the asset branch and updating the bot-owned snapshot branch
    # require these write scopes; all other workflow jobs are denied by default.
    permissions:
      contents: write # Publish the catalog snapshot and mirrored brand marks.
      pull-requests: write # Open and merge the validated snapshot PR.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare bootstrap report
        if: inputs['bootstrap-only'] == true
        run: |
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('generated/catalog.v1.json','utf8')); const report={ok:true,changed:false,dryRun:false,sourceHeads:c.sources.map(s=>({sourceId:s.sourceId,commitSha:s.resolvedCommitSha})),changeReport:{schemaVersion:1,changedSources:[],addedPlugins:[],removedPlugins:[],changedPlugins:[],skippedPlugins:[],permissionSensitiveChanges:[],contentResolution:'complete'},catalogId:c.catalogId,pluginCount:c.plugins.length,sourceCount:c.sources.length}; fs.writeFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json', JSON.stringify(report));"
      - name: Resolve and build catalog
        id: sync
        if: inputs['bootstrap-only'] != true
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs['force-rebuild'] }}
        run: |
          set -o pipefail
          # Curation and build-logic changes alter the artifacts without moving a
          # source pin, and the CLI would otherwise exit unchanged and publish
          # nothing, so the dispatch input is forwarded as an explicit force.
          args=(--json)
          if [ "$FORCE_REBUILD" = "true" ]; then args+=(--force-rebuild); fi
          bun packages/cli/src/index.ts sync "${args[@]}" | tee "$RUNNER_TEMP/catalog-change-report.json"
      - name: Validate catalog
        run: bun run catalog validate --json
      - name: Verify brand marks
        if: inputs['bootstrap-only'] != true
        run: |
          set -o pipefail
          # Marks are staged by the build from the exact bytes each digest was
          # taken over, so this is a local integrity check with no re-fetch.
          # `catalog mirror-icons` remains the backfill path when a snapshot is
          # published from a checkout that has no staged assets.
          bun packages/cli/src/index.ts verify-assets --json \
            | tee "$RUNNER_TEMP/catalog-icon-report.json"
      - name: Publish catalog snapshot to the asset branch
        env:
          SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # The catalog is published to the `catalog-assets` branch rather than
          # to a GitHub Release. GitHub marks exactly one release "latest", and
          # a snapshot reached through `releases/latest/download/…` outbids
          # every versioned release for that slot forever, which is why the
          # repository used to publish a "keep the catalog latest" workflow to
          # win it back and why no `vX.Y.Z` was ever the release a visitor
          # saw first. A content-addressed path gives the same immutability a
          # release tag did — `catalogs/<catalogId>/` cannot be written by any
          # build that produced different bytes — and leaves Releases to mean
          # one thing: a version.
          if [ -z "$SYNC_TOKEN" ]; then
            echo 'CATALOG_SYNC_TOKEN is not configured. Create a fine-grained PAT' >&2
            echo '(Contents: read/write on adea-ai/plugins)' >&2
            echo 'and store it as the CATALOG_SYNC_TOKEN repository secret.' >&2
            exit 1
          fi
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          catalog_id=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('generated/catalog.v1.json','utf8')); process.stdout.write(c.catalogId)")
          export CATALOG_ID="$catalog_id"
          remote="https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A force-push replaces the whole tree, so previously published
          # snapshots are fetched first: a pinned `catalogs/<olderId>/…` URL has
          # to keep resolving, which is the one property the release tag gave.
          worktree="$RUNNER_TEMP/catalog-assets"
          export WORKTREE="$worktree"
          rm -rf "$worktree"
          git init -q "$worktree"
          git -C "$worktree" remote add origin "$remote"
          if git -C "$worktree" fetch -q --depth 1 origin catalog-assets; then
            git -C "$worktree" checkout -q -B catalog-assets FETCH_HEAD
          else
            # First publication: the branch does not exist yet.
            git -C "$worktree" checkout -q --orphan catalog-assets
            git -C "$worktree" rm -rq --cached . 2>/dev/null || true
          fi
          # Drop the current snapshot so a re-run replaces it rather than
          # merging into it, then write this build's bytes over the top.
          rm -rf "$worktree/catalogs/${catalog_id#catalog:}"
          mkdir -p "$worktree/catalogs/${catalog_id#catalog:}"
          # integrity.json enumerates the artifact set, so the snapshot follows
          # the catalog rather than a list maintained beside it.
          node -e "const fs=require('fs'); const path=require('path'); const i=JSON.parse(fs.readFileSync('generated/integrity.json','utf8')); const dir=path.join(process.env.WORKTREE,'catalogs',process.env.CATALOG_ID.replace(/^catalog:/,'')); for (const n of Object.keys(i.files)) fs.copyFileSync(path.join('generated',n), path.join(dir,n)); fs.copyFileSync('generated/integrity.json', path.join(dir,'integrity.json'));"
          # Brand marks are digest-addressed, so they are shared across
          # snapshots and live at the branch root where a browser reads them
          # with no catalog identity in hand.
          cp catalog-assets/* "$worktree/" 2>/dev/null || true
          # The one mutable path: byte-identical to this snapshot's catalog, and
          # the only file a consumer may have cached by name rather than digest.
          cp generated/catalog.v1.json "$worktree/catalog-latest.v1.json"
          git -C "$worktree" add -A
          if git -C "$worktree" diff --cached --quiet; then
            echo 'The asset branch already carries exactly these bytes; nothing to publish.'
            exit 0
          fi
          git -C "$worktree" commit -q -m "chore(catalog): publish ${catalog_id}"
          git -C "$worktree" push -q --force origin HEAD:refs/heads/catalog-assets
          echo "published ${catalog_id}"
          echo "snapshots retained: $(git -C "$worktree" ls-tree --name-only HEAD catalogs/ | wc -l | tr -d ' ')"
      - name: Verify published catalog by reading it back
        env:
          SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          # A force-push has no immutability guarantee to fall back on, so the
          # published bytes are fetched from the URLs a consumer will use and
          # compared against what this build staged. This gate is what an
          # immutable release used to provide for free.
          #
          # raw.githubusercontent is cached per commit, and the pointer is
          # mutable, so a stale read is retried rather than reported as a
          # divergence: a disagreement that survives three attempts is real.
          for attempt in 1 2 3; do
            if bun run verify:catalog-branch -- \
              --artifacts generated \
              --assets catalog-assets; then
              echo 'published catalog verified'
              exit 0
            fi
            echo "read-back attempt ${attempt} disagreed; retrying" >&2
            test "$attempt" -lt 3 || exit 1
            sleep 15
          done

      - name: Open catalog snapshot pull request
        id: commit
        env:
          SYNC_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          branch='chore/catalog-snapshot'
          changed=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/catalog-change-report.json','utf8')); process.stdout.write(String(r.changed === true))")
          if [ -z "$SYNC_TOKEN" ]; then
            echo 'CATALOG_SYNC_TOKEN is not configured. Create a fine-grained PAT'
            echo '(Contents: read/write, Pull requests: read/write on adea-ai/plugins)'
            echo 'and store it as the CATALOG_SYNC_TOKEN repository secret.' >&2
            if [ "$changed" = "true" ]; then exit 1; fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NOTE: push, PR creation and the ready transition MUST use
          # CATALOG_SYNC_TOKEN (a PAT), not GITHUB_TOKEN: events triggered by
          # GITHUB_TOKEN do not start new workflow runs, so a GITHUB_TOKEN-authored
          # pull request would never get its required checks, and a
          # GITHUB_TOKEN-driven ready transition would never start Marketplace CI.
          export GH_TOKEN="$SYNC_TOKEN"
          # Main requires an up-to-date head before a pull request can merge, and
          # this job commits the snapshot on top of the main it checked out at the
          # start of a ~20 minute run. Anything that lands meanwhile -- a Release
          # Please merge, another pull request -- leaves the branch BEHIND with
          # every check green and auto-merge armed, so nothing reports an error
          # and the snapshot simply never lands. Merging main in is the fix, and
          # it moves the head, which invalidates the required `checks` context
          # that only a ready_for_review transition produces.
          converge() {
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/pulls/$1/update-branch" >/dev/null 2>&1
          }
          # Marketplace CI runs only on the ready_for_review transition, so a pull
          # request created as ready -- or a fresh head on one that is already
          # ready -- never reports the required `checks` context and the
          # auto-merge waits forever. A draft->ready cycle fires exactly one
          # transition for the current head. Auto-merge then lands it once the
          # checks pass; a red snapshot stays open for inspection instead.
          arm() {
            if [ "$(gh pr view "$1" --json isDraft --jq '.isDraft')" != "true" ]; then
              gh pr ready --undo "$1"
            fi
            gh pr ready "$1"
            gh pr merge "$1" --squash --auto
          }
          existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ "$changed" != "true" ]; then
            echo 'No source changed; generated catalog remains untouched.'
            # An untouched catalog still leaves a stalled snapshot behind, so a
            # pull request that main has moved past is brought up to date and
            # re-armed rather than waiting for the next real refresh.
            if [ -n "$existing" ] && converge "$existing"; then
              echo "merged main into pull request #${existing}."
              arm "$existing"
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Branch protection on main forbids direct pushes (code-foundry
          # direct workflow: every change lands via PR + required checks).
          # Publish the snapshot on a bot-owned branch and open or update a
          # pull request instead. Review Policy auto-passes bot authors and
          # Validation + Marketplace CI gate the merge, so nothing blocks.
          catalog_id=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('generated/catalog.v1.json','utf8')); process.stdout.write(c.catalogId)")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add generated catalog-assets
          git commit -m "chore(catalog): refresh marketplace snapshot ${catalog_id}"
          git push --force origin "HEAD:${branch}"
          body="Automated marketplace snapshot refresh for ${catalog_id}. Merge with squash once Validation, Review Policy, and Marketplace CI pass."
          if [ -z "$existing" ]; then
            gh pr create --draft --base main --head "$branch" --title "chore(catalog): refresh marketplace snapshot" --body "$body"
            existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          else
            echo "Updated existing pull request #${existing}."
          fi
          if converge "$existing"; then
            echo "merged main into pull request #${existing}."
          fi
          arm "$existing"
          echo "changed=true" >> "$GITHUB_OUTPUT"
